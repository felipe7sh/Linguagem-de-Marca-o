
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora | SENAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header class="senai-header">
        <div class="container">
            <h3 class="mb-0">SENAI</h3>
            <small>Serviço Nacional de Aprendizagem Industrial</small>
        </div>
    </header>

    <main class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card senai-card">

                    <div class="card-body p-4">

                        <h4 class="senai-title mb-4">
                            Calculadora 
                        </h4>

                        <p class="text-muted">
                            Informe os 4 valores
                        </p>

                        <form id="formIMC">

                            <div class="mb-3">
                                <label for="distancia" class="form-label">Distância percorrida (km)</label>
                                <input type="number" class="form-control" id="distancia"
                                       placeholder="Ex: 100" min="0.01" step="any" required>
                            </div>

                                                        <div class="mb-3">
                                <label for="combustivel" class="form-label">Combustível abastecido (litros)</label>
                                <input type="number" class="form-control" id="combustivel"
                                       placeholder="Ex: 30" min="0.01" step="any" required>
                            </div>

                            <div class="mb-3">
                                <label for="preco" class="form-label">Preço do litro (R$)</label>
                                <input type="number" class="form-control" id="preco"
                                       placeholder="Ex: 6.50" min="0.01" step="any" required>
                            </div>

                            <div class="mb-4">
                                <label for="capacidade" class="form-label">Capacidade do tanque (litros)</label>
                                <input type="number" class="form-control" id="capacidade"
                                       placeholder="Ex: 60" min="0.01" step="any" required>
                            </div>

                            <div class="d-flex gap-2">

                                <button type="reset"class="btn btn-outline-secondary w-50"> Resetar
                                </button>

                                <button type="submit"class="btn btn-senai w-50">Calcular
                                </button>

                            </div>

                        </form>

                        <div id="mensagem" class="mt-3"></div>

                    </div>

                </div>

                <p class="text-center text-muted mt-3 small">
                    SENAI | Tecnologia e Educação Profissional
                </p>

            </div>

        </div>

    </main>

</body>
</html>
