
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora | SENAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header class="senai-header">
        <div class="container">
            <h3 class="mb-0">SENAI</h3>
            <small>Serviço Nacional de Aprendizagem Industrial</small>
        </div>
    </header>

    <main class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card senai-card">

                    <div class="card-body p-4">

                        <h4 class="senai-title mb-4">
                            Calculadora 
                        </h4>

                        <p class="text-muted">
                            Informe 2 valores
                        </p>

                        <form id="formIMC">

                            <div class="mb-3">
                                <label for="valor1" class="form-label">
                                    Valor 1
                                </label>

                                <input type="number"
                                       class="form-control"
                                       id="valor1"
                                       placeholder="Ex: 10"
                                       min="0.1"
                                       step="any"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="valor2" class="form-label">
                                    Valor 2
                                </label>

                                <input type="number"
                                       class="form-control"
                                       id="valor2"
                                       placeholder="Ex: 20"
                                       min="0.1"
                                       step="any"
                                       required>
                            </div>

                            <div class="mb-4">
                                <label for="imc" class="form-label">
                                    Resultado
                                </label>

                                <input type="number"
                                       class="form-control"
                                       id="resultado"
                                       placeholder="Resultado"
                                       readonly>
                            </div>

                            <div class="d-flex gap-2">

                                <button type="reset"
                                        class="btn btn-outline-secondary w-50">
                                    Resetar
                                </button>

                                <button type="submit"
                                        class="btn btn-senai w-50">
                                    Calcular
                                </button>

                            </div>

                        </form>

                        <div id="mensagem" class="mt-3"></div>

                    </div>

                </div>

                <p class="text-center text-muted mt-3 small">
                    SENAI | Tecnologia e Educação Profissional
                </p>

            </div>

        </div>

    </main>

</body>
</html>
