<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Acadêmico - Cadastro de Turmas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <strong>SENAI</strong>
          <span class="ms-2">Sistema Acadêmico</span>
        </a>
        <span class="text-white">Olá, Professor</span>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <aside class="col-md-3 col-lg-2 bg-dark min-vh-100 p-3">
          <h6 class="text-white mb-3">MENU</h6>
          <div class="list-group">
            <a href="professor.html" class="list-group-item list-group-item-action">Professor</a>
            <a href="index.html" class="list-group-item list-group-item-action">Alunos</a>
            <a href="cursos.html" class="list-group-item list-group-item-action">Cursos</a>
            <a href="turmas.html" class="list-group-item list-group-item-action active">Turmas</a>
            <a href="regras.html" class="list-group-item list-group-item-action">Regras</a>
          </div>
        </aside>

        <main class="col-md-9 col-lg-10 p-4">
          <div class="mb-4">
            <h2>Cadastro de Turma</h2>
            <p class="text-muted">
              Preencha os dados abaixo para cadastrar uma nova turma.
            </p>
          </div>

          <div class="card shadow-sm">
            <div class="card-header">
              <strong>Dados da turma</strong>
            </div>
            <div class="card-body">
              <form>
                
                <div class="row">
                  <div class="col-md-12 mb-3">
                    <label for="Identificacao" class="form-label">Identificação da Turma</label>
                    <input
                      type="text"
                      class="form-control"
                      id="Identificacao"
                      placeholder="Digite a identificação ou código da turma (ex: 2026-DS-M1)"
                      required
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="Curso" class="form-label">Curso</label>
                    <select class="form-select" id="Curso" required>
                      <option selected disabled value="">Selecione o curso</option>
                      <option value="1">Desenvolvimento de Sistemas</option>
                      <option value="2">Administração</option>
                      <option value="3">Segurança do Trabalho</option>
                    </select>
                  </div>
                  
                  <div class="col-md-6 mb-3">
                    <label class="form-label d-block">Turno</label>
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="Turno"
                        id="TurnoManha"
                        value="manha"
                        required
                      />
                      <label class="form-check-label" for="TurnoManha">Manhã</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="Turno"
                        id="TurnoTarde"
                        value="tarde"
                      />
                      <label class="form-check-label" for="TurnoTarde">Tarde</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="Turno"
                        id="TurnoNoite"
                        value="noite"
                      />
                      <label class="form-check-label" for="TurnoNoite">Noite</label>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="DataInicio" class="form-label">Data de Início</label>
                    <input
                      type="date"
                      class="form-control"
                      id="DataInicio"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="DataTermino" class="form-label">Data de Término</label>
                    <input
                      type="date"
                      class="form-control"
                      id="DataTermino"
                      required
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-4 mb-3">
                    <label for="Vagas" class="form-label">Vagas (Qtd. Alunos)</label>
                    <input
                      type="number"
                      class="form-control"
                      id="Vagas"
                      placeholder="Ex: 40"
                      min="1"
                      required
                    />
                  </div>
                  <div class="col-md-4 mb-3">
                    <label for="Sala" class="form-label">Sala (Número da sala)</label>
                    <input
                      type="text"
                      class="form-control"
                      id="Sala"
                      placeholder="Ex: Sala 102 ou Bloco B"
                      required
                    />
                  </div>
                  <div class="col-md-4 mb-3 d-flex align-items-end pb-2">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="Ativo"
                        checked
                      />
                      <label class="form-check-label" for="Ativo">
                        Turma ativa
                      </label>
                    </div>
                  </div>
                </div>

                <div class="row mt-3">
                  <div class="col-md-12 mb-4">
                    <button 
                      type="reset" 
                      class="btn btn-secondary me-2">
                      Limpar
                    </button>
                    <button 
                      type="submit" 
                      class="btn btn-primary">
                      Cadastrar Turma
                    </button>
                  </div>
                </div>

              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
