<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Acadêmico</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <strong>SENAI</strong>
          <span class="ms-2">Sistema Acadêmico</span>
        </a>
        <span class="text-white">Olá, Professor</span>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <aside class="col-md-3 col-lg-2 bg-dark min-vh-100 p-3">
          <h6 class="text-white mb-3">MENU</h6>
          <div class="list-group">
            <a
              href="professor.html"
              class="list-group-item list-group-item-action active"
              >Professor</a
            >
            <a href="index.html" class="list-group-item list-group-item-action"
              >Alunos</a
            >
            <a href="cursos.html" class="list-group-item list-group-item-action"
              >Cursos</a
            >
            <a href="turmas.html" class="list-group-item list-group-item-action"
              >Turmas</a
            >
            <a href="regras.html" class="list-group-item list-group-item-action"
              >Regras</a
            >
          </div>
        </aside>

        <main class="col-md-9 col-lg-10 p-4">
          <div class="mb-4">
            <h2>Cadastro de Professor</h2>
            <p class="text-muted">
              Preencha os dados abaixo para cadastrar um novo professor.
            </p>
          </div>

          <div class="card shadow-sm">
            <div class="card-header">
              <strong>Dados do professor</strong>
            </div>
            <div class="card-body">
              <form>
                <div class="row">
                  <div class="col-md-12 mb-3">
                    <label for="Nome" class="form-label">Nome completo</label>
                    <input
                      type="text"
                      class="form-control"
                      id="Nome"
                      placeholder="Digite o nome completo"
                      required
                    />
                  </div>

                  <div class="col-md-4 mb-3">
                    <label for="DataNascimento" class="form-label"
                      >Data de Nascimento</label
                    >
                    <input
                      type="date"
                      class="form-control"
                      id="DataNascimento"
                      required
                    />
                  </div>

                  <div class="col-md-4 mb-3">
                    <label for="Genero" class="form-label">Gênero</label>
                    <select class="form-select" id="Genero" required>
                      <option value="" selected disabled>Selecione...</option>
                      <option value="M">Masculino</option>
                      <option value="F">Feminino</option>
                      <option value="O">Outro</option>
                      <option value="N">Prefiro não informar</option>
                    </select>
                  </div>

                  <div class="col-md-4 mb-3">
                    <label for="Ativo" class="form-label">Status (Ativo)</label>
                    <select class="form-select" id="Ativo" required>
                      <option value="1" selected>Sim</option>
                      <option value="0">Não</option>
                    </select>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label for="Email" class="form-label">E-mail</label>
                    <input
                      type="email"
                      class="form-control"
                      id="Email"
                      placeholder="exemplo@email.com"
                      required
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label for="Telefone" class="form-label">Telefone</label>
                    <input
                      type="tel"
                      class="form-control"
                      id="Telefone"
                      placeholder="(00) 00000-0000"
                      required
                    />
                  </div>

                  <div class="col-md-4 mb-3">
                    <label for="CEP" class="form-label">CEP</label>
                    <input
                      type="text"
                      class="form-control"
                      id="CEP"
                      placeholder="00000-000"
                      required
                    />
                  </div>

                  <div class="col-md-8 mb-3">
                    <label for="Endereco" class="form-label">Endereço</label>
                    <input
                      type="text"
                      class="form-control"
                      id="Endereco"
                      placeholder="Rua, número, complemento"
                      required
                    />
                  </div>

                  <div class="col-md-4 mb-3">
                    <label for="Bairro" class="form-label">Bairro</label>
                    <input
                      type="text"
                      class="form-control"
                      id="Bairro"
                      placeholder="Nome do bairro"
                      required
                    />
                  </div>
                  
                  <div class="col-md-4 mb-3">
                    <label for="Cidade" class="form-label">Cidade</label>
                    <input
                      type="text"
                      class="form-control"
                      id="Cidade"
                      placeholder="Nome da cidade"
                      required
                    />
                  </div>
                  <div class="col-md-4 mb-3">
                    <label for="Estado" class="form-label">Estado (UF)</label>
                    <select class="form-select" id="Estado" required>
                      <option value="" selected disabled>
                        Selecione o estado...
                      </option>
                      <option value="AC">Acre</option>
                      <option value="AL">Alagoas</option>
                      <option value="AP">Amapá</option>
                      <option value="AM">Amazonas</option>
                      <option value="BA">Bahia</option>
                      <option value="CE">Ceará</option>
                      <option value="DF">Distrito Federal</option>
                      <option value="ES">Espírito Santo</option>
                      <option value="GO">Goiás</option>
                      <option value="MA">Maranhão</option>
                      <option value="MT">Mato Grosso</option>
                      <option value="MS">Mato Grosso do Sul</option>
                      <option value="MG">Minas Gerais</option>
                      <option value="PA">Pará</option>
                      <option value="PB">Paraíba</option>
                      <option value="PR">Paraná</option>
                      <option value="PE">Pernambuco</option>
                      <option value="PI">Piauí</option>
                      <option value="RJ">Rio de Janeiro</option>
                      <option value="RN">Rio Grande do Norte</option>
                      <option value="RS">Rio Grande do Sul</option>
                      <option value="RO">Rondônia</option>
                      <option value="RR">Roraima</option>
                      <option value="SC">Santa Catarina</option>
                      <option value="SP">São Paulo</option>
                      <option value="SE">Sergipe</option>
                      <option value="TO">Tocantins</option>
                    </select>
                  </div>

                  <div class="col-md-12 mb-3">
                    <label class="form-label d-block"
                      >Turnos que trabalha</label
                    >
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="turnoManha"
                        value="Manhã"
                      />
                      <label class="form-check-label" for="turnoManha"
                        >Manhã</label
                      >
                    </div>
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="turnoTarde"
                        value="Tarde"
                      />
                      <label class="form-check-label" for="turnoTarde"
                        >Tarde</label
                      >
                    </div>
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="turnoNoite"
                        value="Noite"
                      />
                      <label class="form-check-label" for="turnoNoite"
                        >Noite</label
                      >
                    </div>
                  </div>

                  <div class="row">
                <div class="form-check mb-3">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="Ativo"
                        checked
                      />
                      <label class="form-check-label" for="Ativo"
                        >Professor ativo</label
                      >
                    </div>
                </div>

                  <div class="col-md-12 mt-3">
                    <button type="submit" class="btn btn-primary">
                      Salvar Cadastro
                    </button>
                    <button type="reset" class="btn btn-secondary ms-2">
                      Limpar
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
