<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Acadêmico - Cadastro de Regras</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <strong>SENAI</strong>
          <span class="ms-2">Sistema Acadêmico</span>
        </a>
        <span class="text-white">Olá, Professor</span>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <aside class="col-md-3 col-lg-2 bg-dark min-vh-100 p-3">
          <h6 class="text-white mb-3">MENU</h6>
          <div class="list-group">
            <a href="professor.html" class="list-group-item list-group-item-action">Professor</a>
            <a href="index.html" class="list-group-item list-group-item-action">Alunos</a>
            <a href="cursos.html" class="list-group-item list-group-item-action">Cursos</a>
            <a href="turmas.html" class="list-group-item list-group-item-action">Turmas</a>
            <a href="regras.html" class="list-group-item list-group-item-action active">Regras</a>
          </div>
        </aside>

        <main class="col-md-9 col-lg-10 p-4">
          <div class="mb-4">
            <h2>Cadastro de Regras Acadêmicas</h2>
            <p class="text-muted">
              Preencha os dados abaixo para configurar uma nova regra de negócio do sistema.
            </p>
          </div>

          <div class="card shadow-sm">
            <div class="card-header">
              <strong>Dados da Regra</strong>
            </div>
            <div class="card-body">
              <form>
                
                <div class="row">
                  <div class="col-md-12 mb-3">
                    <label for="marlon_nomeregra" class="form-label">Nome da regra</label>
                    <input
                      type="text"
                      class="form-control"
                      id="marlon_nomeregra"
                      placeholder="Ex: Média mínima para aprovação"
                      required
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="marlon_categoria" class="form-label">Categoria</label>
                    <select class="form-select" id="marlon_categoria" required>
                      <option selected disabled value="">Selecione a categoria</option>
                      <option value="notas">Notas e Avaliações</option>
                      <option value="frequencia">Frequência e Faltas</option>
                      <option value="matricula">Matrícula e Turmas</option>
                    </select>
                  </div>
                  
                  <div class="col-md-6 mb-3">
                    <label for="marlon_valor" class="form-label">Valor / Parâmetro</label>
                    <input
                      type="text"
                      class="form-control"
                      id="marlon_valor"
                      placeholder="Ex: 7.0 ou 25%"
                      required
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="marlon_dtinicio" class="form-label">Data de Início da Vigência</label>
                    <input
                      type="date"
                      class="form-control"
                      id="marlon_dtinicio"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="marlon_dtfim" class="form-label">Data de Término da Vigência</label>
                    <input
                      type="date"
                      class="form-control"
                      id="marlon_dtfim"
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-12 mb-3">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="marlon_regraativa"
                        checked
                      />
                      <label class="form-check-label" for="marlon_regraativa">
                        Regra ativa imediatamente
                      </label>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-12 mb-4">
                    <label for="marlon_descricaoregra" class="form-label">Descrição detalhada</label>
                    <textarea
                      class="form-control"
                      id="marlon_descricaoregra"
                      rows="3"
                      placeholder="Descreva detalhadamente o funcionamento e comportamento desta regra no sistema..."
                      required
                    ></textarea>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-12 mb-2">
                    <button 
                      type="reset" 
                      class="btn btn-secondary me-2">
                      Limpar
                    </button>
                    <button 
                      type="submit" 
                      class="btn btn-primary">
                      Salvar Regra
                    </button>
                  </div>
                </div>

              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
