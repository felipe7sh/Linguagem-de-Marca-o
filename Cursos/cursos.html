<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Acadêmico - Cadastro de Cursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <strong>SENAI</strong>
          <span class="ms-2">Sistema Acadêmico</span>
        </a>
        <span class="text-white">Olá, Professor</span>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <aside class="col-md-3 col-lg-2 bg-dark min-vh-100 p-3">
          <h6 class="text-white mb-3">MENU</h6>
          <div class="list-group">
            <a href="professor.html" class="list-group-item list-group-item-action">Professor</a>
            <a href="index.html" class="list-group-item list-group-item-action">Alunos</a>
            <a href="cursos.html" class="list-group-item list-group-item-action active">Cursos</a>
            <a href="turmas.html" class="list-group-item list-group-item-action">Turmas</a>
            <a href="regras.html" class="list-group-item list-group-item-action">Regras</a>
          </div>
        </aside>

        <main class="col-md-9 col-lg-10 p-4">
          <div class="mb-4">
            <h2>Cadastro de Curso</h2>
            <p class="text-muted">
              Preencha os dados abaixo para cadastrar um novo curso na instituição.
            </p>
          </div>

          <div class="card shadow-sm">
            <div class="card-header">
              <strong>Dados do curso</strong>
            </div>
            <div class="card-body">
              <form>
                
                <div class="row">
                  <div class="col-md-12 mb-3">
                    <label for="NomeCurso" class="form-label">Nome do curso</label>
                    <input
                      type="text"
                      class="form-control"
                      id="NomeCurso"
                      placeholder="Digite o nome do curso (ex: Desenvolvimento de Sistemas)"
                      required
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-12 mb-3">
                    <label for="Descricao" class="form-label">Descrição</label>
                    <input
                      type="text"
                      class="form-control"
                      id="Descricao"
                      placeholder="Breve resumo sobre os objetivos e foco do curso"
                      required
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-4 mb-3">
                    <label for="CargaHoraria" class="form-label">Carga horária (20h a 160h)</label>
                    <input
                      type="number"
                      class="form-control"
                      id="CargaHoraria"
                      min="20"
                      max="160"
                      placeholder="Ex: 120"
                      required
                    />
                  </div>
                  
                  <div class="col-md-4 mb-3">
                    <label for="Nivel" class="form-label">Nível</label>
                    <select class="form-select" id="Nivel" required>
                      <option selected disabled value="">Selecione o nível</option>
                      <option value="basico">Básico</option>
                      <option value="intermediario">Intermediário</option>
                      <option value="avancado">Avançado</option>
                    </select>
                  </div>

                  <div class="col-md-4 mb-3">
                    <label for="Modalidade" class="form-label">Modalidade</label>
                    <select class="form-select" id="Modalidade" required>
                      <option selected disabled value="">Selecione a modalidade</option>
                      <option value="presencial">Presencial</option>
                      <option value="online">Online</option>
                      <option value="hibrido">Híbrido</option>
                    </select>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-12 mb-3">
                    <label class="form-label d-block">Turnos Disponíveis</label>
                    
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="TurnoManha"
                        value="manha"
                      />
                      <label class="form-check-label" for="TurnoManha">Manhã</label>
                    </div>
                    
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="TurnoTarde"
                        value="tarde"
                      />
                      <label class="form-check-label" for="TurnoTarde">Tarde</label>
                    </div>
                    
                    <div class="form-check form-check-inline mb-3">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="TurnoNoite"
                        value="noite"
                      />
                      <label class="form-check-label" for="TurnoNoite">Noite</label>
                    </div>

                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="Ativo"
                        checked
                      />
                      <label class="form-check-label" for="Ativo">
                        Curso ativo para novas turmas
                      </label>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-12 mb-4">
                    <label for="Grade" class="form-label">Grade Curricular</label>
                    <textarea
                      class="form-control"
                      id="Grade"
                      rows="4"
                      placeholder="Insira os módulos, disciplinas ou tópicos abordados no curso (um por linha)..."
                      required
                    ></textarea>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-12 mb-2">
                    <button 
                      type="reset" 
                      class="btn btn-secondary me-2">
                      Limpar
                    </button>
                    <button 
                      type="submit" 
                      class="btn btn-primary">
                      Cadastrar Curso
                    </button>
                  </div>
                </div>

              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
